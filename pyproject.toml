
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodatalab"
version = "0.1.0"
description = "Scientific biological and agricultural data analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3"
]

[tool.setuptools.packages.find]
include = ["biodatalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
