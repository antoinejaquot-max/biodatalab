
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biodatalab"
version = "0.2.0"
description = "Open-source platform for biological and agricultural data analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
app = [
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
include = ["biodatalab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
